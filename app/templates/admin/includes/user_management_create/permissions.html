<!-- Permissions Section -->
<div class="col-xl-12 mb-4">
    <div class="card profile-card-modern">
        <div class="card-body-modern">
            <h5 class="section-subtitle mb-4">
                <i class="ph-bold ph-shield-check"></i>
                Permissions
            </h5>
            
            <div class="row g-3">
                <!-- Can Create Users -->
                <div class="col-xl-6 col-lg-6 col-md-12">
                    <div class="form-check form-switch permission-checkbox">
                        <input 
                            class="form-check-input" 
                            type="checkbox" 
                            id="createCanCreateUsers" 
                            name="can_create_users"
                        />
                        <label class="form-check-label" for="createCanCreateUsers">
                            <i class="ph-bold ph-user-plus"></i>
                            Can Create Users
                        </label>
                        <small class="form-text text-muted d-block">
                            Can create new admin users within their scope
                        </small>
                    </div>
                </div>
                
                <!-- Can Manage Users -->
                <div class="col-xl-6 col-lg-6 col-md-12">
                    <div class="form-check form-switch permission-checkbox">
                        <input 
                            class="form-check-input" 
                            type="checkbox" 
                            id="createCanManageUsers" 
                            name="can_manage_users"
                        />
                        <label class="form-check-label" for="createCanManageUsers">
                            <i class="ph-bold ph-users-three"></i>
                            Can Manage Users
                        </label>
                        <small class="form-text text-muted d-block">
                            Can edit, deactivate, and manage admin users
                        </small>
                    </div>
                </div>
                
                <!-- Can Set Deadlines -->
                <div class="col-xl-6 col-lg-6 col-md-12">
                    <div class="form-check form-switch permission-checkbox">
                        <input 
                            class="form-check-input" 
                            type="checkbox" 
                            id="createCanSetDeadlines" 
                            name="can_set_deadlines"
                        />
                        <label class="form-check-label" for="createCanSetDeadlines">
                            <i class="ph-bold ph-calendar-check"></i>
                            Can Set Deadlines
                        </label>
                        <small class="form-text text-muted d-block">
                            Can set and modify form submission deadlines
                        </small>
                    </div>
                </div>
                
                <!-- Can Approve Submissions -->
                <div class="col-xl-6 col-lg-6 col-md-12">
                    <div class="form-check form-switch permission-checkbox">
                        <input 
                            class="form-check-input" 
                            type="checkbox" 
                            id="createCanApproveSubmissions" 
                            name="can_approve_submissions"
                        />
                        <label class="form-check-label" for="createCanApproveSubmissions">
                            <i class="ph-bold ph-check-circle"></i>
                            Can Approve Submissions
                        </label>
                        <small class="form-text text-muted d-block">
                            Can review, approve, or reject form submissions
                        </small>
                    </div>
                </div>
                
                <!-- Can View System Logs -->
                <div class="col-xl-6 col-lg-6 col-md-12">
                    <div class="form-check form-switch permission-checkbox">
                        <input 
                            class="form-check-input" 
                            type="checkbox" 
                            id="createCanViewSystemLogs" 
                            name="can_view_system_logs"
                        />
                        <label class="form-check-label" for="createCanViewSystemLogs">
                            <i class="ph-bold ph-list-bullets"></i>
                            Can View System Logs
                        </label>
                        <small class="form-text text-muted d-block">
                            Can access system activity and audit logs
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
