# Production Docker Compose Override
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# For secrets: docker-compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d

version: "3.9"

services:
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Uncomment to use Docker secrets (recommended for production)
    # secrets:
    #   - mysql_root_password
    #   - mysql_password
    # environment:
    #   MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    #   MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=200 --innodb-buffer-pool-size=1G

  django:
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    # Uncomment to use Docker secrets
    # secrets:
    #   - django_secret_key
    # environment:
    #   SECRET_KEY_FILE: /run/secrets/django_secret_key
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    restart: always
    read_only: false
    tmpfs:
      - /tmp
      - /var/tmp

  fastapi:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    restart: always
    read_only: false
    tmpfs:
      - /tmp
      - /var/tmp

  celery:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    restart: always
    read_only: false
    tmpfs:
      - /tmp
      - /var/tmp

  celery-beat:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    restart: always

  nginx:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'
        reservations:
          memory: 128M
          cpus: '0.05'
    restart: always
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Uncomment to use Docker secrets
    # secrets:
    #   - redis_password
    # command: redis-server --appendonly yes --requirepass $$(cat /run/secrets/redis_password)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    restart: always

# Uncomment and create secrets files for production
# secrets:
#   mysql_root_password:
#     file: ./secrets/mysql_root_password.txt
#   mysql_password:
#     file: ./secrets/mysql_password.txt
#   django_secret_key:
#     file: ./secrets/django_secret_key.txt
#   redis_password:
#     file: ./secrets/redis_password.txt
