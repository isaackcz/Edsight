# Development Docker Compose Override
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

version: "3.9"

services:
  django:
    environment:
      DEBUG: "True"
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/*/__pycache__
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  fastapi:
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/*/__pycache__

  celery:
    environment:
      CELERY_LOG_LEVEL: "DEBUG"

  mysql:
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --general-log=1 --slow-query-log=1

  redis:
    ports:
      - "6380:6379"

