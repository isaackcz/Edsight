<!-- Recent Activity Section -->
<div class="col-xl-4 mt-5">
    <div class="table-container">
        <div class="table-header">
            <h3>Recent Activity</h3>
        </div>
        <div class="table-body">
            <!-- Loading State -->
            <div id="activityLoadingState" class="text-center py-4" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2 text-muted">Loading activity...</p>
            </div>
            
            <!-- Activity List -->
            <div class="activity-list" id="activityList">
                <div class="text-center py-4 text-muted">
                    <i class="ph-bold ph-info" style="font-size: 2rem;"></i>
                    <p class="mt-2">Loading activity...</p>
                </div>
            </div>
            
            <!-- Pagination -->
            <nav aria-label="Activity pagination" class="mt-3">
                <ul class="pagination justify-content-center" id="activityPagination">
                    <!-- Pagination will be populated by JavaScript -->
                </ul>
            </nav>
        </div>
    </div>
</div>
