{% load static %}

<!-- Statistics Charts Section -->
<div class="user-management-stats-section">
    <div class="row g-4">
        <!-- User Types Chart -->
        <div class="col-xl-4 col-lg-6 col-md-12">
            <div class="chart-card">
                <div class="chart-header">
                    <h4>
                        <i class="ph-bold ph-users"></i>
                        User Types Distribution
                    </h4>
                </div>
                <div class="chart-container">
                    <div id="userTypesChart" style="width: 100%; height: 300px;"></div>
                </div>
            </div>
        </div>
        
        <!-- Status Chart -->
        <div class="col-xl-4 col-lg-6 col-md-12">
            <div class="chart-card">
                <div class="chart-header">
                    <h4>
                        <i class="ph-bold ph-check-circle"></i>
                        User Status Distribution
                    </h4>
                </div>
                <div class="chart-container">
                    <div id="userStatusChart" style="width: 100%; height: 300px;"></div>
                </div>
            </div>
        </div>
        
        <!-- Permission Levels Chart -->
        <div class="col-xl-4 col-lg-12 col-md-12">
            <div class="chart-card">
                <div class="chart-header">
                    <h4>
                        <i class="ph-bold ph-shield-check"></i>
                        Permission Levels
                    </h4>
                </div>
                <div class="chart-container">
                    <div id="permissionLevelsChart" style="width: 100%; height: 300px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>
