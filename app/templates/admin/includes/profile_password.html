<!-- Change Password Section -->
<div class="col-xl-12 mb-4">
    <div class="card">
        <div class="card-header">
            <i class="ph-bold ph-key"></i>
            <h3>Change Password</h3>
        </div>
        <div class="card-body">
            <form id="changePasswordForm">
                <div class="row g-3">
                    <div class="col-xl-12">
                        <label for="currentPassword" class="form-label">
                            <i class="ph-bold ph-lock"></i> Current Password
                        </label>
                        <input type="password" class="form-control" id="currentPassword" name="current_password" required />
                        <div class="invalid-feedback" id="currentPasswordError"></div>
                    </div>
                    
                    <div class="col-xl-6">
                        <label for="newPassword" class="form-label">
                            <i class="ph-bold ph-key"></i> New Password
                        </label>
                        <input type="password" class="form-control" id="newPassword" name="new_password" required />
                        <div class="form-text">
                            Password must be at least 8 characters and include uppercase, lowercase, number, and special character.
                        </div>
                        <div class="invalid-feedback" id="newPasswordError"></div>
                    </div>
                    
                    <div class="col-xl-6">
                        <label for="confirmPassword" class="form-label">
                            <i class="ph-bold ph-key"></i> Confirm New Password
                        </label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirm_password" required />
                        <div class="invalid-feedback" id="confirmPasswordError"></div>
                    </div>
                    
                    <div class="col-xl-12">
                        <div class="alert alert-info" id="passwordRequirements" style="display: none;">
                            <strong>Password Requirements:</strong>
                            <ul class="mb-0 mt-2" id="passwordRequirementList"></ul>
                        </div>
                    </div>
                    
                    <div class="col-xl-12">
                        <button type="submit" class="btn btn-primary" id="changePasswordBtn">
                            <i class="ph-bold ph-floppy-disk"></i> Change Password
                        </button>
                        <button type="reset" class="btn btn-secondary">
                            <i class="ph-bold ph-x"></i> Clear
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
