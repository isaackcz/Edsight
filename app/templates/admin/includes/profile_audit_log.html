<!-- Audit Log Section -->
<div class="col-xl-12 mb-4">
    <div class="card">
        <div class="card-header">
            <i class="ph-bold ph-file-text"></i>
            <h3>Audit Log</h3>
            <div class="d-flex gap-2">
                <select class="form-select form-select-sm" id="auditLogTypeFilter" style="width: auto;">
                    <option value="all">All Logs</option>
                    <option value="activity">Activity Logs</option>
                    <option value="audit">Audit Logs</option>
                </select>
            </div>
        </div>
        <div class="card-body">
            <!-- Loading State -->
            <div id="auditLogLoading" class="text-center py-4" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2 text-muted">Loading audit logs...</p>
            </div>
            
            <!-- Audit Log Content -->
            <div id="auditLogContent">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Action</th>
                                <th>Resource</th>
                                <th>Details</th>
                                <th>IP Address</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="auditLogTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">Loading audit logs...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <nav aria-label="Audit log pagination" class="mt-3">
                    <ul class="pagination justify-content-center" id="auditLogPagination">
                        <!-- Pagination will be populated by JavaScript -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
