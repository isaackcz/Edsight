<!-- Dashboard Statistics Cards -->
<div class="row g-3">
    <div class="col-xl-3 col-lg-6 col-md-6 col-sm-12">
        <div class="card">
            <div class="card-header">
                <i class="ph-bold ph-users"></i>
                <h3>Total Users</h3>
            </div>
            <div class="card-value" id="stat-total-users">--</div>
            <div class="card-trend positive">
                <i class="ph-bold ph-arrow-up"></i> Active users in system
            </div>
        </div>
    </div>

    <div class="col-xl-3 col-lg-6 col-md-6 col-sm-12">
        <div class="card">
            <div class="card-header">
                <i class="ph-bold ph-warning"></i>
                <h3>Suspicious Activity</h3>
            </div>
            <div class="card-value" id="stat-suspicious-activity">--</div>
            <div class="card-trend warning">
                <i class="ph-bold ph-warning"></i> Requires attention
            </div>
        </div>
    </div>

    <div class="col-xl-3 col-lg-6 col-md-6 col-sm-12">
        <div class="card">
            <div class="card-header">
                <i class="ph-bold ph-user-check"></i>
                <h3>Active Sessions</h3>
            </div>
            <div class="card-value" id="stat-active-sessions">--</div>
            <div class="card-trend positive">
                <i class="ph-bold ph-circle"></i> Currently active
            </div>
        </div>
    </div>

    <div class="col-xl-3 col-lg-6 col-md-6 col-sm-12">
        <div class="card">
            <div class="card-header">
                <i class="ph-bold ph-user-minus"></i>
                <h3>Suspended Accounts</h3>
            </div>
            <div class="card-value" id="stat-suspended-accounts">--</div>
            <div class="card-trend negative">
                <i class="ph-bold ph-warning"></i> Suspended users
            </div>
        </div>
    </div>
</div>
