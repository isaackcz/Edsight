<!-- Charts Section -->
<div class="charts-section">
    <div class="row g-3">
        <!-- Role Distribution Chart -->
        <div class="col-xl-6 col-lg-6 col-md-12">
            <div class="chart-card">
                <div class="chart-header">
                    <h4>
                        <i class="ph-bold ph-users"></i>
                        Role Distribution
                    </h4>
                </div>
                <div class="chart-container">
                    <canvas id="roleDistributionChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Status Distribution Chart -->
        <div class="col-xl-6 col-lg-6 col-md-12">
            <div class="chart-card">
                <div class="chart-header">
                    <h4>
                        <i class="ph-bold ph-check-circle"></i>
                        Status Distribution
                    </h4>
                </div>
                <div class="chart-container">
                    <canvas id="statusDistributionChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Permission Usage by Role Chart -->
        <div class="col-xl-12 col-lg-12 col-md-12">
            <div class="chart-card">
                <div class="chart-header">
                    <h4>
                        <i class="ph-bold ph-shield-check"></i>
                        Permission Usage by Role
                    </h4>
                </div>
                <div class="chart-container">
                    <canvas id="permissionUsageChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Permission Flags Breakdown Chart -->
        <div class="col-xl-6 col-lg-6 col-md-12">
            <div class="chart-card">
                <div class="chart-header">
                    <h4>
                        <i class="ph-bold ph-key"></i>
                        Permission Flags Breakdown
                    </h4>
                </div>
                <div class="chart-container">
                    <canvas id="permissionFlagsChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Access Scope Analysis Chart -->
        <div class="col-xl-6 col-lg-6 col-md-12">
            <div class="chart-card">
                <div class="chart-header">
                    <h4>
                        <i class="ph-bold ph-map-pin"></i>
                        Access Scope Analysis
                    </h4>
                </div>
                <div class="chart-container">
                    <canvas id="accessScopeChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Geographic Distribution Chart -->
        <div class="col-xl-6 col-lg-6 col-md-12">
            <div class="chart-card">
                <div class="chart-header">
                    <h4>
                        <i class="ph-bold ph-map-trifold"></i>
                        Geographic Distribution
                    </h4>
                </div>
                <div class="chart-container">
                    <canvas id="geographicDistributionChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- User Activity Timeline Chart -->
        <div class="col-xl-6 col-lg-6 col-md-12">
            <div class="chart-card">
                <div class="chart-header">
                    <h4>
                        <i class="ph-bold ph-chart-line"></i>
                        User Activity Timeline
                    </h4>
                </div>
                <div class="chart-container">
                    <canvas id="activityTimelineChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
